<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<!-- interactive_example_v2.svg -->

<svg
   width="100%"
   height="100%"
   viewBox="0 0 150 110"
   preserveAspectRatio="xMidYMid meet"
   id="mainSvg"
   version="1.1"
   xmlns="http://www.w3.org/2000/svg"
   xmlns:svg="http://www.w3.org/2000/svg">
  <defs
     id="defs1" />
  <style
     id="style1">
    .clickable-shape {
      cursor: pointer;
    }
    .clickable-shape:hover {
      opacity: 0.7;
    }
    .clickable-text {
      cursor: pointer; /* Делаем курсор указателем и для текста */
      pointer-events: none; /* Опционально: позволяет кликать &quot;сквозь&quot; текст на фигуру под ним */
    }
    /* Однако, если используем делегирование, pointer-events можно не трогать */
  </style>
  <!-- Группа для кнопки -->
  <g
     id="myButtonGroup"
     class="clickable-shape"
     transform="translate(0,-50)">
    <rect
       x="50"
       y="50"
       width="100"
       height="50"
       fill="#0000ff"
       id="rect1" />
    <text
       x="100"
       y="80"
       text-anchor="middle"
       fill="#ffffff"
       font-family="Arial"
       font-size="14px"
       class="clickable-text"
       id="text1">Click Me!</text>
  </g>
  <!-- Круг, который будет двигаться -->
  <circle
     id="movingCircle"
     cx="10"
     cy="100"
     r="10"
     fill="#ff0000" />
  <script
     type="application/ecmascript"
     id="script1"><![CDATA[
    function moveCircle() {
      var circle = document.getElementById('movingCircle');
      var currentX = parseFloat(circle.getAttribute('cx'));
      var newX = (currentX + 20) % 280;
      circle.setAttribute('cx', newX);
    }

    // Прикрепляем обработчик к родительскому элементу SVG
    document.getElementById('mainSvg').addEventListener('click', function(event) {
      // Проверяем, был ли клик на элементе с ID 'myButtonGroup' или его потомке
      // Используем closest для проверки, принадлежит ли элемент (или его родитель) кнопке
      if (event.target.closest('#myButtonGroup')) {
        moveCircle(); // Вызываем функцию
      }
    });
  ]]></script>
</svg>
