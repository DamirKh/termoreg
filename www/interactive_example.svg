<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<!-- interactive_example_v2.svg -->

<svg
   width="300"
   height="200"
   id="mainSvg"
   version="1.1"
   sodipodi:docname="interactive_example.svg"
   inkscape:export-filename="interactive_example.svg"
   inkscape:export-xdpi="96"
   inkscape:export-ydpi="96"
   inkscape:version="1.4.2 (f4327f4, 2025-05-13)"
   xmlns:inkscape="http://www.inkscape.org/namespaces/inkscape"
   xmlns:sodipodi="http://sodipodi.sourceforge.net/DTD/sodipodi-0.dtd"
   xmlns="http://www.w3.org/2000/svg"
   xmlns:svg="http://www.w3.org/2000/svg">
  <defs
     id="defs1" />
  <sodipodi:namedview
     id="namedview1"
     pagecolor="#ffffff"
     bordercolor="#000000"
     borderopacity="0.25"
     inkscape:showpageshadow="2"
     inkscape:pageopacity="0.0"
     inkscape:pagecheckerboard="0"
     inkscape:deskcolor="#d1d1d1"
     inkscape:zoom="4.1542523"
     inkscape:cx="144.30996"
     inkscape:cy="124.81187"
     inkscape:window-width="2560"
     inkscape:window-height="1377"
     inkscape:window-x="-8"
     inkscape:window-y="-8"
     inkscape:window-maximized="1"
     inkscape:current-layer="mainSvg" />
  <style
     id="style1">
    .clickable-shape {
      cursor: pointer;
    }
    .clickable-shape:hover {
      opacity: 0.7;
    }
    .clickable-text {
      cursor: pointer; /* Делаем курсор указателем и для текста */
      pointer-events: none; /* Опционально: позволяет кликать &quot;сквозь&quot; текст на фигуру под ним */
    }
    /* Однако, если используем делегирование, pointer-events можно не трогать */
  </style>
  <!-- Группа для кнопки -->
  <g
     id="myButtonGroup"
     class="clickable-shape">
    <rect
       x="50"
       y="50"
       width="100"
       height="50"
       fill="blue"
       id="rect1" />
    <text
       x="100"
       y="80"
       text-anchor="middle"
       fill="white"
       font-family="Arial"
       font-size="14"
       class="clickable-text"
       id="text1">
      Click Me!
    </text>
  </g>
  <!-- Круг, который будет двигаться -->
  <circle
     id="movingCircle"
     cx="10"
     cy="150"
     r="10"
     fill="red" />
  <script
     type="application/ecmascript"
     id="script1"><![CDATA[
    function moveCircle() {
      var circle = document.getElementById('movingCircle');
      var currentX = parseFloat(circle.getAttribute('cx'));
      var newX = (currentX + 20) % 280;
      circle.setAttribute('cx', newX);
    }

    // Прикрепляем обработчик к родительскому элементу SVG
    document.getElementById('mainSvg').addEventListener('click', function(event) {
      // Проверяем, был ли клик на элементе с ID 'myButtonGroup' или его потомке
      // Используем closest для проверки, принадлежит ли элемент (или его родитель) кнопке
      if (event.target.closest('#myButtonGroup')) {
        moveCircle(); // Вызываем функцию
      }
    });
  ]]></script>
</svg>
