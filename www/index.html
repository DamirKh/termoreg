<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>HTU21D монитор</title>
  <link rel="icon" href="/favicon.ico">
</head>
<body>
  <h1>Температура</h1>
  <p id="cur_temerature">--- °C</p>
  <p id="lamp_state">---</p>
  <p id="countdown_timer" style="display:none;">---</p>
  <button onclick="setLampOn()"> ON </button>
  <button onclick="setLampOff()"> OFF </button>

<script>
  async function setLampOn() {
    try {
      const response = await fetch('/set_lamp_state', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ state: true }),
      });
      if (!response.ok) {
        const errorData = await response.json();
        throw new Error(errorData.error || `HTTP error! status: ${response.status}`);
      }
      console.log('Lamp turned ON');
    } catch (error) {
      console.error('Error turning lamp ON:', error);
      alert('Failed to turn lamp ON: ' + error.message);
    }
  }
  async function setLampOff() {
    try {
      const response = await fetch('/set_lamp_state', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ state: false }),
      });
      if (!response.ok) {
        const errorData = await response.json();
        throw new Error(errorData.error || `HTTP error! status: ${response.status}`);
      }
      console.log('Lamp turned OFF');
    } catch (error) {
      console.error('Error turning lamp OFF:', error);
      alert('Failed to turn lamp OFF: ' + error.message);
    }
  }
  // Пример функции, вызываемой при нажатии кнопки
  async function setTimeOnESP() {
    // Пример кнопки в HTML (например, в diag.html или новой странице)
    // <button onclick="setTimeOnESP()">Set ESP32 Time from Browser (UTC)</button>
    try {
      // --- ИСПРАВЛЕНО: Получаем текущее UTC время браузера в миллисекундах с 1970 ---
      const now = new Date();
      const nowUTCMs = Date.UTC(
          now.getUTCFullYear(),
          now.getUTCMonth(),  // getUTCMonth() возвращает 0-11
          now.getUTCDate(),
          now.getUTCHours(),
          now.getUTCMinutes(),
          now.getUTCSeconds()
          // getUTCMilliseconds() можно добавить, если нужна точность до мс
          // now.getUTCMilliseconds()
      );
      // Отправляем timestamp в миллисекундах с 1970 (UTC) на ESP32
      const response = await fetch('/set_time_from_hmi', {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json',
        },
        body: JSON.stringify({ timestamp: nowUTCMs }),
      });

      if (!response.ok) {
        const errorData = await response.json();
        throw new Error(errorData.error || `HTTP error! status: ${response.status}`);
      }

      const result = await response.json();
      console.log('Time set successfully on ESP32 (UTC):', result);
      // Показываем, какое UTC время было установлено
      const d = new Date(result.new_time_esp_epoch_s * 1000 + 946684800000); // Преобразуем обратно к 1970 эпохе для отображения
      const humanUTC = d.toUTCString(); // Показываем в UTC
      const localHumanTime = d.toLocaleString();
      alert(`Time set successfully on ESP32!\nUTC Time on ESP: ${humanUTC}\nESP Timestamp (2000 epoch): ${result.new_time_esp_epoch_s}\nThat is Local Time ${localHumanTime}`);

    } catch (error) {
      console.error('Error setting time on ESP32:', error);
      alert('Failed to set time on ESP32: ' + error.message);
    }
  }

  /* ---------- new WebSocket time feed ---------- */
  const ws = new WebSocket(`ws://${location.host}/ws/tags`);
  ws.onopen = () => {
    ws.send('+cur_temerature');   // подписаться на тег cur_temerature
    ws.send('+lamp_state'); // и на lamp_state
    ws.send('+countdown_timer'); // и на countdown_timer
    console.log('WS opened');
  };
  ws.onmessage = ev => {
    const data = JSON.parse(ev.data);
    // console.log(data); // uncomment for debug
    /* превращаем секунды в миллисекунды */
    const d = new Date(data.ts * 1000);
    const human = d.toLocaleString();   // "25.06.2025, 18:07:23"
    console.log(human, data.tag, data.val);

    switch (data.tag) {
      case 'cur_temerature':
        if (typeof data.val === 'number') {
          document.getElementById('cur_temerature').textContent = data.val.toFixed(2) + ' °C';
          document.getElementById('cur_temerature').setAttribute('title', 'Последнее обновление: ' + human);
        }
        break;

      case 'lamp_state':
        document.getElementById('lamp_state').textContent = data.val;
        document.getElementById('lamp_state').setAttribute('title', 'Последнее обновление: ' + human);
        document.getElementById('countdown_timer').style.display = (data.val === true) ? 'block' : 'none';
        break;

      case 'countdown_timer':
        document.getElementById('countdown_timer').textContent = data.val + ' сек';
        break


      // добавьте другие теги по аналогии
      default:
        console.log('Unknown tag:', data.tag);
    }
  };
  ws.onclose = () => console.log('WS closed');
</script>
</body>
</html>
