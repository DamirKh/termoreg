<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>HTU21D монитор</title>
  <link rel="icon" href="/favicon.ico">
</head>
<body>
  <h1>Температура кристалла ESP32</h1>
  <p id="th">--- °C</p>
  <p id="timeLabel">---</p>

<script>
/* ---------- new WebSocket time feed ---------- */
    const ws = new WebSocket(`ws://${location.host}/ws/tags`);
    ws.onopen  = () => console.log('WS time feed opened');
    ws.onmessage = ev => {
      const data = JSON.parse(ev.data);
      // console.log(data); // uncomment for debug
      if ('th' in data && typeof data.th === 'number') {
        document.getElementById('th').textContent = data.th.toFixed(2) + ' °C';
      }

      if ('timeLabel' in data) {
        document.getElementById('timeLabel').textContent = data.timeLabel;
      }
    };
    ws.onclose = () => console.log('WS closed');
</script>
</body>
</html>
